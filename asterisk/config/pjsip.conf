; Voice Clone Guard - PJSIP config for WebRTC + SIP
; Place via Docker volume at /etc/asterisk/pjsip.conf

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
; For demo without TLS, WSS will fallback to WS. Generate self-signed if needed:
; mkdir -p keys && openssl req -x509 -newkey rsa:4096 -keyout keys/asterisk.key -out keys/asterisk.crt -days 365 -nodes -subj "/CN=localhost"

; === Default WebRTC template ===
[webrtc-template](!)
type=endpoint
transport=transport-ws
context=voice-guard
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
use_avpf=yes
ice_support=yes
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
direct_media=no

[webrtc-template-auth](!)
type=auth
auth_type=userpass

[webrtc-template-aor](!)
type=aor
max_contacts=5
remove_existing=yes

; === Extensions 1001-1005 demo numbers ===
[1001](webrtc-template)
auth=1001
aors=1001
[1001](webrtc-template-auth)
username=1001
password=1001pass
[1001](webrtc-template-aor)

[1002](webrtc-template)
auth=1002
aors=1002
[1002](webrtc-template-auth)
username=1002
password=1002pass
[1002](webrtc-template-aor)

